<div class="p-6">
  <h2 class="text-2xl font-bold text-gray-900 mb-6">Our Vehicles</h2>
  <div *ngIf="!isLoading && cars.length === 0" class="text-center py-10">
    <p class="text-gray-500">No cars available</p>
  </div>

  <div *ngIf="!isLoading && cars.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <app-car-card *ngFor="let car of cars; trackBy: trackByCar">
    </app-car-card>
  </div>

</div>
