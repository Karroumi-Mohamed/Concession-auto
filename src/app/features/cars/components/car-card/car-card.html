<article class="border border-gray-200 rounded-xl overflow-hidden bg-white shadow-sm hover:shadow-lg transition-shadow">
  <img [src]="car.image" [alt]="car.brand.name + ' ' + car.model" class="w-full h-48 object-cover">

  <div class="p-4">
    <h3 class="text-xl font-semibold text-gray-900 mb-2">
      {{ car.brand.name }} {{ car.model }}
    </h3>

    <p class="text-2xl font-bold text-blue-600 mb-3">
      {{ formatPrice() }}
    </p>

    <span [class]="car.available
      ? 'inline-block px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800'
      : 'inline-block px-3 py-1 rounded-full text-sm font-medium bg-red-100 text-red-800'">
      {{ car.available ? 'Available' : 'Sold' }}
    </span>

    <p class="text-gray-500 text-sm mt-3 capitalize">{{ car.fuel }}</p>

    <div class="flex gap-2 mt-4">
      <button (click)="onViewDetails()"
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
        View
      </button>
      <button (click)="onEdit()"
        class="px-4 py-2 bg-gray-100 text-gray-700 rounded-md hover:bg-gray-200 transition-colors">
        Edit
      </button>
      <button (click)="onDelete()"
        class="px-4 py-2 bg-red-100 text-red-800 rounded-md hover:bg-red-200 transition-colors">
        Delete
      </button>
    </div>
  </div>
</article>
